            type: string
            format: uri
          description: The URI associated with the user
          required: true
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Count'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Service response
                properties:
                  collection:
                    type: array
                    description: The collection of recent invitees
                    items:
                      $ref: '#/components/schemas/RecentInvitee'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - collection
                  - pagination
              examples:
                Recent Invitees:
                  value:
                    collection:
                      - email: test@example.com
                        event_start_time: '2023-06-19T14:30:00.000000Z'
                        first_name: John
                        last_name: Doe
                        full_name: John Doe
                        timezone: America/New_York
                        time_notation: 12h
                        locale: en
                    pagination:
                      count: 20
                      next_page: 'https://calendly.com/recent_invitees?count=1&page_token=sNjq4TvMDfUHEl7zHRR0k0E1PCEJWvdi'
                      previous_page: 'https://calendly.com/recent_invitees?count=1&page_token=VJs2rfDYeY8ahZpq0QI1O114LJkNjd7H'
                      next_page_token: sNjq4TvMDfUHEl7zHRR0k0E1PCEJWvdi
                      previous_page_token: VJs2rfDYeY8ahZpq0QI1O114LJkNjd7H
        '400':
          $ref: '#/components/responses/INVALID_ARGUMENT'
        '401':
          $ref: '#/components/responses/UNAUTHENTICATED'
        '403':
          description: Permission Denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    enum:
                      - Permission Denied
                  message:
                    type: string
                    enum:
                      - You are not allowed to view this event
              examples:
                Caller is not the event owner:
                  value:
                    title: Permission Denied
                    message: You are not allowed to view this event
                Caller is not an organization owner/admin:
                  value:
                    title: Permission Denied
                    message: You are not allowed to view this event
                caller is not a member of the team:
                  value:
                    title: Permission Denied
                    message: You are not allowed to view this event
