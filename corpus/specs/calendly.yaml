      summary: List Event Invitees
      tags:
        - Scheduled Events
      security:
        - oauth2: []
        - personal_access_token: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            example: AAAAAAAAAAAAAAAA
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - canceled
          description: Indicates if the invitee "canceled" or still "active"
        - name: sort
          in: query
          schema:
            type: string
            default: 'created_at:asc'
          description: 'Order results by the **created_at** field and direction specified: ascending ("asc") or descending ("desc")'
        - name: email
          in: query
          schema:
            type: string
            format: email
            example: bob@example.com
