          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailabilitySchedule'
                required:
                  - collection
              examples:
                Availability schedules:
                  value:
                    collection:
                      - uri: 'https://api.calendly.com/user_availability_schedule/AAAAAAAAAAAAAAAA'
                        default: true
                        name: Working Hours
                        user: 'https://api.calendly.com/users/AAAAAAAAAAAAAAAA'
                        timezone: America/New_York
                        rules:
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '09:30'
                            wday: sunday
                            date: '2022-12-31'
                      - uri: 'https://api.calendly.com/user_availability_schedule/BBBBBBBBBBBBBBBB'
                        default: false
                        name: Evening Hours
                        user: 'https://api.calendly.com/users/AAAAAAAAAAAAAAAA'
                        timezone: America/New_York
                        rules:
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '17:00'
                            wday: monday
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '17:00'
                            wday: tuesday
                          - type: wday
                            intervals: []
                            wday: wednesday
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '17:00'
                            wday: thursday
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '17:00'
                            wday: friday
                          - type: wday
                            intervals: []
                            wday: saturday
                          - type: date
                            intervals:
                              - from: '08:30'
                                to: '09:30'
                            date: '2028-12-31'
        '400':
          $ref: '#/components/responses/INVALID_ARGUMENT'
        '401':
          $ref: '#/components/responses/UNAUTHENTICATED'
        '403':
          $ref: '#/components/responses/USER_NOT_IN_ORGANIZATION_and_SCOPES_FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '500':
          $ref: '#/components/responses/UNKNOWN'
      operationId: list-user-availability-schedules
      description: |-
        Returns the availability schedules of the given user.

        <Info title="Required scopes">
        > `availability:read`
        </Info>
      parameters:
        - $ref: '#/components/parameters/User'
      tags:
        - Availability
      security:
        - oauth2: []
        - personal_access_token: []
    post:
      summary: Create User Availability Schedule
      description: |-
        Creates a new availability schedule for the authenticated user. The schedule is not applied to any event type until configured separately.

        **Rules requirements:**
        - Must include exactly one `wday` rule for each day of the week (sunday through saturday).
        - `date` rules are optional overrides on top of the weekly rules.
        - Date rules dated before today, in the schedule's timezone, will return `400 Bad Request`.
        - An empty `intervals` array means no availability for that weekday or date.

        <Info title="Required scopes">
        > `availability:write`
        </Info>
      tags:
        - Availability
      security:
        - oauth2: []
        - personal_access_token: []
      operationId: create-user-availability-schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - timezone
                - rules
              properties:
                name:
                  type: string
                  description: The name of this Availability Schedule.
                  example: Office Hours
                timezone:
                  type: string
                  description: The timezone for which this Availability Schedule is originated in.
                  example: America/Los_Angeles
                rules:
                  type: array
                  description: Complete set of availability rules for the schedule. Must include exactly one wday rule for each day of the week. date rules are optional overrides on top of the weekly rules.
                  items:
                    $ref: '#/components/schemas/AvailabilityRule'
            examples:
              Office Hours with Date Override:
                value:
                  name: Office Hours
                  timezone: America/Los_Angeles
                  rules:
                    - type: wday
                      wday: sunday
                      intervals: []
                    - type: wday
                      wday: monday
                      intervals: []
                    - type: wday
                      wday: tuesday
                      intervals:
                        - from: '14:00'
                          to: '16:00'
                    - type: wday
                      wday: wednesday
                      intervals: []
                    - type: wday
                      wday: thursday
                      intervals:
                        - from: '14:00'
                          to: '16:00'
                    - type: wday
                      wday: friday
                      intervals: []
                    - type: wday
                      wday: saturday
                      intervals: []
                    - type: date
                      date: '2026-12-22'
                      intervals:
                        - from: '09:00'
                          to: '12:00'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    $ref: '#/components/schemas/AvailabilitySchedule'
                required:
                  - resource
        '400':
          description: |-
            Bad Request - Invalid arguments, including:
            - Missing required fields (name, timezone, or rules)
            - Missing wday rules for one or more days of the week
            - Date rules dated before today in the schedule's timezone
            - Invalid time formats or timezone values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      title:
                        type: string
                        enum:
                          - Invalid Argument
                      message:
                        type: string
                        enum:
                          - The supplied parameters are invalid.
        '401':
          $ref: '#/components/responses/UNAUTHENTICATED'
        '403':
          $ref: '#/components/responses/USER_NOT_IN_ORGANIZATION_and_SCOPES_FORBIDDEN'
        '500':
          $ref: '#/components/responses/UNKNOWN'
      x-fern-ignore: true
    parameters: []
