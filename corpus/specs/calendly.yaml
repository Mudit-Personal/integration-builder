                            intervals:
                              - from: '08:30'
                                to: '09:30'
                            wday: monday
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '09:30'
                            wday: tuesday
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '09:30'
                            wday: wednesday
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '09:30'
                            wday: thursday
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '09:30'
                            wday: friday
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '09:30'
                            wday: saturday
                An admin or org owner updating a user:
                  value:
                    resource:
                      event_type: 'https://api.calendly.com/event_types/AAAAAAAAAAAAAAAA'
                      availability_setting: host
                      availability_rule:
                        timezone: America/New_York
                        name: Working Hours
                        uri: 'https://api.calendly.com/user_availability_schedules/AAAAAAAAAAAAAAAA'
                        user: 'https://api.calendly.com/users/AAAAAAAAAAAAAAAA'
                        rules:
                          - type: wday
                            intervals:
                              - from: '08:30'
                                to: '09:30'
                            wday: sunday
                            date: '2022-12-31'
