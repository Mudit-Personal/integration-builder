          example: 'https://api.calendly.com/event_types/AAAAAAAAAAAAAAAA'
          required: true
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
          description: Start time of the requested availability range. Date cannot be in the past.
          example: '2020-01-02T20:00:00.000000Z'
          required: true
        - name: end_time
