    MeetingRecap:
      type: object
      description: A meeting recap generated for a Calendly scheduled event or an external event.
      title: Meeting Recap
      required:
        - uri
        - app_url
        - status
      properties:
        uri:
          type: string
          description: Canonical reference (unique identifier) for the recap
          format: uri
        app_url:
          type: string
          format: uri
          description: URL for an authorized Calendly user to open this meeting recap in the Calendly web app. Requires authentication and access to the recap.
          example: 'https://calendly.com/app/tracked_meetings/BBBBBBBBBBBBBBBB'
        event:
          type: string
          nullable: true
          description: Canonical reference (unique identifier) for the event
          format: uri
        status:
          type: string
          description: 'Either ''Available'', ''Processing'', or ''Unavailable'''
        name:
          type: string
          nullable: true
          description: Name of the meeting.
          example: Weekly Sync
        location:
          $ref: '#/components/schemas/Location'
        start_time:
          type: string
          format: date-time
          nullable: true
          description: 'Scheduled start time of the meeting (UTC, ISO 8601).'
          example: '2025-11-08T20:28:00.561000Z'
        end_time:
          type: string
          format: date-time
          nullable: true
          description: 'Scheduled end time of the meeting (UTC, ISO 8601).'
          example: '2025-11-08T21:28:00.561000Z'
        created_at:
          type: string
          format: date-time
          nullable: true
          description: 'When the meeting recap was created (UTC, ISO 8601).'
          example: '2025-11-08T19:00:00.000000Z'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 'When the meeting recap was last updated (UTC, ISO 8601).'
          example: '2025-11-08T22:00:00.000000Z'
        attendees:
          type: array
          nullable: true
          description: Meeting attendees derived from tracked-meeting participants. Same shape as meeting_recap webhook attendees.
          items:
            type: object
            required:
              - host
              - user_email
              - user_name
            properties:
              host:
                type: boolean
                description: Whether this attendee is the meeting host.
              user_email:
                type: string
                format: email
                description: Attendee email address.
                example: john@example.com
              user_name:
                type: string
                description: Attendee display name.
                example: John Smith
          example:
            - host: true
              user_name: John Smith
              user_email: john@example.com
            - host: false
              user_name: Steve Johnson
              user_email: steve@example2.com
        summary_md:
          type: string
          nullable: true
          description: Summary Markdown
        action_items_md:
          type: string
          nullable: true
          description: Action Items Markdown
        discussion_md:
          type: string
          nullable: true
          description: Discussion Markdown
        transcript:
          type: string
          nullable: true
          description: Canonical reference (unique identifier) for the transcript
          format: uri
        share_link:
          type: string
          nullable: true
          description: URL for sharing this meeting recap with others. Access is determined by the recap’s sharing settings.
          format: uri
          example: 'https://calendly.com/s/meetings/BBBBBBBBBBBBBBBB'
    MeetingRecapListItem:
      type: object
