      summary: List Contacts
      tags:
        - Contacts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - collection
                  - pagination
        '400':
          $ref: '#/components/responses/INVALID_ARGUMENT'
        '401':
          $ref: '#/components/responses/UNAUTHENTICATED'
        '403':
          $ref: '#/components/responses/CONTACTS_AND_SCOPES_FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '429':
          $ref: '#/components/responses/RATE_LIMIT_EXCEEDED'
        '500':
          $ref: '#/components/responses/UNKNOWN'
      operationId: list-contacts
      description: |-
        Returns a collection of Contacts

        <Info title="Required scopes">
        > `contacts:read`
        </Info>
      parameters:
        - schema:
            type: string
            example: 'created_at:asc'
          in: query
          name: sort
          description: 'Order results by the specified field and direction. Accepts comma-separated list of {field}:{direction} values. Supported fields are: created_at, updated_at. Sort direction is specified as: asc, desc.'
        - schema:
            type: string
            example: 'contact_email@example.com, another-email@example.com'
          in: query
          name: email
          description: Filter results by exact match on email address. Accepts a comma-separated list.
        - schema:
            type: string
            example: '+1 888-888-8888, +1 777-777-7777'
          in: query
          name: phone_number
          description: Filter results by exact match on phone number. Accepts a comma-separated list.
        - schema:
            type: string
            example: 'America/Los_Angeles, America/New_York'
          in: query
          name: timezone
          description: Filter results by exact match on the IANA time zone name(s). Accepts a comma-separated list of time zones.
        - schema:
            type: string
            example: 'Jane Doe, John Smith'
          in: query
          name: name
          description: Filter results by partial match on name(s). Accepts a comma-separated list-- each segment is matched independently (commas in the query string separate values).
        - schema:
            type: string
            example: 'Account Executive, CEO'
          in: query
          name: job_title
          description: Filter results by partial match on job title(s). Accepts a comma-separated list-- each segment is matched independently (commas in the query string separate values).
        - schema:
            type: string
            example: 'Company Name, Another Company'
          in: query
          name: company
          description: Filter results by partial match on company name(s). Accepts a comma-separated list-- each segment is matched independently (commas in the query string separate values).
        - schema:
            type: string
            example: US
          in: query
          name: country
          description: Filter results by exact match on two-letter country code (ISO 3166-1 alpha-2). Accepts a comma-separated list.
        - schema:
            type: string
            example: 'NY, CA'
          in: query
          name: state
          description: 'Filter results by exact match on state(s), province(s), or region(s). Accepts a comma-separated list of values.'
        - schema:
            type: string
            example: 'San Francisco, Buffalo'
          in: query
          name: city
          description: Filter results by partial match on city(ies). Accepts a comma-separated list-- each segment is matched independently (commas in the query string separate values).
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/PageToken'
        - schema:
            type: string
            example: custom_fields
          in: query
          name: exclude
          required: false
          description: 'Omit the listed fields from the response. Currently only `custom_fields` is supported. When omitted, all fields are returned.'
      security:
        - oauth2: []
        - personal_access_token: []
    post:
      summary: Create Contact
      tags:
        - Contacts
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    $ref: '#/components/schemas/Contact'
                required:
                  - resource
        '400':
          $ref: '#/components/responses/INVALID_ARGUMENT'
        '401':
          $ref: '#/components/responses/UNAUTHENTICATED'
        '403':
          $ref: '#/components/responses/CONTACTS_AND_SCOPES_FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/ALREADY_EXISTS'
        '429':
          $ref: '#/components/responses/RATE_LIMIT_EXCEEDED'
        '500':
          $ref: '#/components/responses/UNKNOWN'
      operationId: create-contact
      description: |-
        Create a new Contact

        <Info title="Required scopes">
        > `contacts:write`
        </Info>
      security:
        - oauth2: []
        - personal_access_token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - emails
              properties:
                name:
                  type: string
                  example: Jane Doe
                emails:
                  type: array
                  maxItems: 10
                  description: The user's email addresses. Max 10.
                  items:
                    $ref: '#/components/schemas/Email'
                phone_numbers:
                  type: array
                  maxItems: 10
                  description: The user's phone numbers. Max 10.
                  items:
                    $ref: '#/components/schemas/PhoneNumber'
                timezone:
                  type: string
                job_title:
                  type: string
                company:
                  type: string
                country:
                  type: string
                state:
                  type: string
                city:
                  type: string
                linkedin:
                  type: string
                  format: uri
                custom_fields:
                  type: array
                  description: 'Custom field values to set on the contact. Each item requires a `uuid` (the custom field definition identifier) and a `value`; any other keys (such as `label`) are ignored. The entire request is rejected if any `uuid` is unknown, any `value` is the wrong type for its field (including an array for a scalar field or a scalar for an array field), or any `single_select` `value` is not one of the field definition''s option `uuid`s or `label`s (an invalid `single_select` value returns an error that lists the valid options).'
                  items:
                    type: object
                    required:
                      - uuid
                      - value
                    properties:
                      uuid:
                        type: string
                        description: Unique identifier of the custom field definition.
                        example: CCCCCCCCCCCCCCCC
                      value:
                        nullable: true
                        description: 'The custom field value; the accepted type is set by the field definition''s `field_type`. `text` and `single_select` take a string (`single_select` must equal one of the definition''s option `uuid`s or option `label`s. Label matching is exact and case-sensitive. If more than one option has the same label, a label value is rejected; send the option `uuid` instead. An invalid value returns an error that lists the valid options); `number` takes a number; `boolean` takes a boolean; `currency` takes a number amount in the field definition''s currency (not minor/cent units; the ISO currency code lives on the field definition, not on this entry); `date` takes a string in ISO 8601 date format (`YYYY-MM-DD`); `tags` takes an array of strings. Scalar fields reject array values, and `tags` rejects non-array values.'
                        oneOf:
                          - type: string
                            example: event
                          - type: number
                            example: 1234.56
                          - type: boolean
                            example: true
                          - type: array
                            items:
                              type: string
                            example:
                              - enterprise
                              - strategic
