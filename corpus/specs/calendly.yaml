    ContactCustomFieldSource:
      title: Contact Custom Field Source
      type: object
      description: 'Source metadata for system-generated fields, such as invitee questions.'
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - event_type_invitee_question
        event_type_uri:
          type: string
          format: uri
          example: 'https://api.calendly.com/event_types/AAAAAAAAAAAAAAAA'
        question:
          type: string
          example: Please share anything that will help prepare for our meeting.
    ContactCustomField:
      title: Contact Custom Field
      type: object
      description: A custom field value on a Contact. `uri` is the custom field definition URI. `label` is derived from the custom field definition's name.
      required:
        - uri
        - value
      properties:
        uri:
          type: string
          format: uri
          description: Canonical URI of the custom field definition this value belongs to.
          example: 'https://api.calendly.com/contacts/custom_field_definitions/CCCCCCCCCCCCCCCC'
        label:
          type: string
          readOnly: true
          description: User-facing display name of the custom field (for readability).
          example: Lead source
        value:
          nullable: true
          description: 'The custom field value; the accepted type is set by the field definition''s `field_type`. `text` and `single_select` take a string (`single_select` must equal one of the definition''s option `uuid`s or option `label`s. Label matching is exact and case-sensitive. If more than one option has the same label, a label value is rejected; send the option `uuid` instead. An invalid value returns an error that lists the valid options); `number` takes a number; `boolean` takes a boolean; `currency` takes a number amount in the field definition''s currency (not minor/cent units; the ISO currency code lives on the field definition, not on this entry); `date` takes a string in ISO 8601 date format (`YYYY-MM-DD`); `tags` takes an array of strings. Scalar fields reject array values, and `tags` rejects non-array values.'
          oneOf:
            - type: string
              example: event
            - type: number
              example: 1234.56
            - type: boolean
              example: true
            - type: array
              items:
                type: string
              example:
                - enterprise
                - strategic
    ContactCustomFieldDefinition:
      title: Contact Custom Field Definition
      type: object
      description: A custom field definition describes the schema for a field that can be applied to Contacts.
      required:
        - uri
        - label
        - field_type
        - created_at
        - updated_at
      properties:
        uri:
          type: string
          format: uri
          description: Canonical URI of the custom field definition.
          example: 'https://api.calendly.com/contacts/custom_field_definitions/CCCCCCCCCCCCCCCC'
        label:
          type: string
          description: User-facing display name.
          example: Lead source
        field_type:
          type: string
          description: 'Calendly custom field kind, which determines both input behavior and the expected value type.'
          enum:
            - text
            - number
            - currency
            - tags
            - date
            - single_select
            - invitee_question
          example: single_select
        options:
          type: array
          description: Allowed options for `single_select` fields. Returned in configured display order.
          items:
            $ref: '#/components/schemas/ContactCustomFieldOption'
        currency:
          type: string
          description: 'ISO currency code for currency fields, if applicable.'
          example: USD
        source:
          description: Source metadata for system-generated fields. Present when `field_type` is `invitee_question`.
          allOf:
            - $ref: '#/components/schemas/ContactCustomFieldSource'
        created_at:
          type: string
          format: date-time
          example: '2026-06-03T20:52:43Z'
          description: Creation timestamp.
        updated_at:
          type: string
          format: date-time
          example: '2026-06-03T20:52:43Z'
          description: Last update timestamp.
