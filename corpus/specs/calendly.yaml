          description: This is the default Availability Schedule in use.
        name:
          type: string
          example: Working Hours
          description: The name of this Availability Schedule.
        user:
          type: string
          format: uri
          example: 'https://api.calendly.com/users/AAAAAAAAAAAAAAAA'
          description: A URI reference to a User.
        timezone:
          type: string
          example: America/New_York
          description: The timezone for which this Availability Schedule is originated in.
        rules:
          type: array
          description: The rules of this Availability Schedule.
          items:
            $ref: '#/components/schemas/AvailabilityRule'
      required:
        - uri
        - default
        - name
        - user
        - timezone
        - rules
      example:
        uri: 'https://api.calendly.com/user_availability_schedule/AAAAAAAAAAAAAAAA'
        default: true
        name: Working Hours
        user: 'https://api.calendly.com/users/AAAAAAAAAAAAAAAA'
        rules:
          - type: wday
            intervals:
              - from: '08:30'
                to: '17:00'
            wday: monday
          - type: wday
            intervals:
              - from: '08:30'
                to: '17:00'
            wday: tuesday
          - type: wday
            intervals: []
            wday: wednesday
          - type: wday
            intervals:
              - from: '08:30'
                to: '17:00'
            wday: thursday
          - type: wday
            intervals:
              - from: '08:30'
                to: '17:00'
            wday: friday
          - type: wday
            intervals: []
            wday: saturday
          - type: date
            intervals:
              - from: '08:30'
                to: '09:30'
            date: '2028-12-31'
        timezone: America\/New_York
    AvailabilityRule:
      title: Availability Rule
      type: object
      description: |-
        The rules for an availability schedule. When creating or updating a schedule, you must include exactly one wday rule for each day of the week (sunday through saturday). date rules are optional overrides on top of the weekly rules.

        - When type is "wday", the wday field is required and date must be omitted.
        - When type is "date", the date field is required and wday must be omitted.
      required:
        - type
        - intervals
      properties:
        type:
          type: string
          enum:
            - wday
            - date
          example: wday
          description: The type of this Availability Rule; can be "wday" or a specific "date".
        intervals:
          type: array
          description: 'The intervals to be applied to this Rule. Each interval represents when booking a meeting is allowed. If the interval array is empty, then there is no booking availability for that day. Time is in 24h format (i.e. "17:30") and local to the timezone in the Availability Schedule.'
          items:
            type: object
            required:
              - from
              - to
            properties:
              from:
                type: string
                description: 'Format: `"hh:mm"`'
                pattern: '(\d\d):(\d\d)'
                example: '08:30'
              to:
                type: string
                description: 'Format: `"hh:mm"`'
                pattern: '(\d\d):(\d\d)'
                example: '09:30'
        wday:
          type: string
          enum:
            - sunday
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
          description: The day of the week for which this Rule should be applied to. Required when type is "wday".
        date:
          type: string
          example: '2022-12-31'
          pattern: '^\d{4}\-(0?[1-9]|1[012])\-(0?[1-9]|[12][0-9]|3[01])$'
          description: A specific date that this should be applied to (i.e. "2030-12-31"). Required when type is "date". Format `YYYY-MM-DD`.
      example:
        type: wday
        intervals:
          - from: '08:30'
            to: '09:30'
        wday: sunday
    UserHolidaySet:
